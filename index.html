<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Spectral:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-elevated: #1a1a1a;
            --bg-card: #252525;
            --accent-gold: #d4a574;
            --accent-amber: #ff9f43;
            --accent-red: #ee5a6f;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --border-subtle: #333333;

            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Spectral', serif;
            --font-mono: 'Space Mono', monospace;

            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Background grain texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(212, 165, 116, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 159, 67, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Grain overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            opacity: 0.4;
            z-index: 1;
        }

        .app-container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
        }

        /* Header */
        header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-subtle);
            background: linear-gradient(180deg, var(--bg-elevated) 0%, transparent 100%);
            backdrop-filter: blur(20px);
            position: relative;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-amber) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 1.5rem;
            letter-spacing: 2px;
            box-shadow: 0 4px 16px rgba(212, 165, 116, 0.3);
        }

        .logo-text {
            font-family: var(--font-display);
            font-size: 2rem;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-amber) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-status {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent-gold);
            border-radius: 50%;
            margin-right: 0.5rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        /* Edit Mode */
        .edit-mode {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
            animation: fadeIn 0.6s var(--transition-smooth);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .script-input-section {
            margin-bottom: 3rem;
        }

        .script-textarea {
            width: 100%;
            min-height: 300px;
            background: var(--bg-card);
            border: 2px solid var(--border-subtle);
            border-radius: 12px;
            padding: 2rem;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 1.125rem;
            line-height: 1.8;
            resize: vertical;
            transition: all 0.3s var(--transition-smooth);
        }

        .script-textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 4px rgba(212, 165, 116, 0.1);
        }

        .script-textarea::placeholder {
            color: var(--text-muted);
        }

        /* Controls Grid */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .control-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 2rem;
            transition: all 0.3s var(--transition-smooth);
        }

        .control-panel:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .control-label {
            font-family: var(--font-mono);
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: block;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .slider-container {
            margin-bottom: 1.5rem;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-elevated);
            outline: none;
            -webkit-appearance: none;
            position: relative;
        }

        .slider::-webkit-slider-track {
            height: 6px;
            border-radius: 3px;
            background: var(--bg-elevated);
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-amber) 100%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(212, 165, 116, 0.4);
            transition: transform 0.2s var(--transition-bounce);
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: var(--bg-elevated);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-amber) 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(212, 165, 116, 0.4);
        }

        .slider-value {
            display: block;
            font-family: var(--font-mono);
            font-size: 1.5rem;
            color: var(--accent-gold);
            margin-top: 0.5rem;
            font-weight: bold;
        }

        /* Size Options */
        .size-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .size-btn {
            background: var(--bg-elevated);
            border: 2px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 0.75rem 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s var(--transition-smooth);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .size-btn:hover {
            border-color: var(--accent-gold);
            color: var(--text-primary);
        }

        .size-btn.active {
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-amber) 100%);
            border-color: var(--accent-gold);
            color: var(--bg-dark);
            font-weight: bold;
        }

        /* Start Button */
        .start-button-container {
            text-align: center;
        }

        .start-btn {
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-amber) 100%);
            color: var(--bg-dark);
            border: none;
            padding: 1.5rem 4rem;
            font-family: var(--font-display);
            font-size: 2rem;
            letter-spacing: 3px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s var(--transition-smooth);
            box-shadow: 0 8px 24px rgba(212, 165, 116, 0.4);
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .start-btn:hover::before {
            left: 100%;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(212, 165, 116, 0.6);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        /* Teleprompter Mode */
        .teleprompter-mode {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            z-index: 1000;
            overflow: hidden;
        }

        .teleprompter-mode.active {
            display: block;
            animation: slideIn 0.5s var(--transition-smooth);
        }

        @keyframes slideIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Countdown */
        .countdown {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            z-index: 10;
        }

        .countdown-number {
            font-family: var(--font-display);
            font-size: 15rem;
            color: var(--accent-gold);
            text-shadow: 0 0 60px rgba(212, 165, 116, 0.6);
            animation: countdownPulse 1s ease-in-out;
        }

        @keyframes countdownPulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Script Display */
        .script-display-container {
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            padding-top: 40vh;
            position: relative;
        }

        .script-display {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 4rem;
            font-family: var(--font-body);
            line-height: 1.8;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Text sizes */
        .text-small { font-size: 1.5rem; }
        .text-medium { font-size: 2rem; }
        .text-large { font-size: 2.5rem; }
        .text-xlarge { font-size: 3rem; }

        /* Teleprompter Controls */
        .teleprompter-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(0deg, var(--bg-dark) 0%, transparent 100%);
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            opacity: 0;
            transition: opacity 0.3s var(--transition-smooth);
            z-index: 100;
        }

        .teleprompter-mode:hover .teleprompter-controls {
            opacity: 1;
        }

        .control-btn {
            background: var(--bg-card);
            border: 2px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s var(--transition-smooth);
            font-family: var(--font-mono);
            font-size: 0.875rem;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            border-color: var(--accent-gold);
            background: var(--accent-gold);
            color: var(--bg-dark);
            transform: translateY(-2px);
        }

        .control-btn.playing {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: var(--text-primary);
        }

        .control-btn.exit-btn {
            background: var(--accent-red);
            border-color: var(--accent-red);
        }

        /* Speed Indicator */
        .speed-indicator {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: var(--bg-card);
            border: 2px solid var(--border-subtle);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.875rem;
            opacity: 0;
            transition: opacity 0.3s var(--transition-smooth);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .speed-indicator.visible {
            opacity: 1;
        }

        .speed-label {
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
            display: block;
            margin-bottom: 0.25rem;
        }

        .speed-value {
            color: var(--accent-gold);
            font-size: 1.25rem;
            font-weight: bold;
        }

        /* Keyboard Shortcuts Helper */
        .shortcuts-helper {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            background: var(--bg-card);
            border: 2px solid var(--border-subtle);
            border-radius: 8px;
            padding: 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity 0.3s var(--transition-smooth);
            backdrop-filter: blur(10px);
            max-width: 300px;
        }

        .teleprompter-mode:hover .shortcuts-helper {
            opacity: 0.8;
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .shortcut-key {
            color: var(--accent-gold);
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .controls-grid {
                grid-template-columns: 1fr;
            }

            .script-display {
                padding: 0 2rem;
            }

            .countdown-number {
                font-size: 8rem;
            }

            .shortcuts-helper {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">TP</div>
                    <h1 class="logo-text">Teleprompter Pro</h1>
                </div>
                <div class="header-status">
                    <span class="status-indicator"></span>
                    Ready to Record
                </div>
            </div>
        </header>

        <!-- Edit Mode -->
        <main class="edit-mode" id="editMode">
            <section class="script-input-section">
                <h2 class="section-title">Your Script</h2>
                <textarea
                    class="script-textarea"
                    id="scriptInput"
                    placeholder="Paste or type your script here...&#10;&#10;When you're ready, configure your settings below and hit 'Start Teleprompter' to begin.&#10;&#10;Pro tip: Use keyboard shortcuts for seamless control during your presentation."
                ></textarea>
            </section>

            <div class="controls-grid">
                <div class="control-panel">
                    <label class="control-label">Scroll Speed</label>
                    <div class="slider-container">
                        <input
                            type="range"
                            class="slider"
                            id="speedSlider"
                            min="0.5"
                            max="5"
                            step="0.5"
                            value="2"
                        >
                        <span class="slider-value" id="speedValue">2.0x</span>
                    </div>
                </div>

                <div class="control-panel">
                    <label class="control-label">Text Size</label>
                    <div class="size-options">
                        <button class="size-btn" data-size="small">S</button>
                        <button class="size-btn active" data-size="medium">M</button>
                        <button class="size-btn" data-size="large">L</button>
                        <button class="size-btn" data-size="xlarge">XL</button>
                    </div>
                </div>
            </div>

            <div class="start-button-container">
                <button class="start-btn" id="startBtn">Start Teleprompter</button>
            </div>
        </main>

        <!-- Teleprompter Mode -->
        <div class="teleprompter-mode" id="teleprompterMode">
            <div class="countdown" id="countdown" style="display: none;">
                <div class="countdown-number" id="countdownNumber">3</div>
            </div>

            <div class="script-display-container" id="scriptContainer">
                <div class="script-display text-medium" id="scriptDisplay"></div>
            </div>

            <div class="speed-indicator" id="speedIndicator">
                <span class="speed-label">Speed</span>
                <span class="speed-value" id="currentSpeed">2.0x</span>
            </div>

            <div class="teleprompter-controls">
                <button class="control-btn" id="pauseBtn">Pause (Space)</button>
                <button class="control-btn exit-btn" id="exitBtn">Exit (Esc)</button>
            </div>

            <div class="shortcuts-helper">
                <div class="shortcut-item">
                    <span>Pause/Resume</span>
                    <span class="shortcut-key">Space</span>
                </div>
                <div class="shortcut-item">
                    <span>Exit</span>
                    <span class="shortcut-key">Esc</span>
                </div>
                <div class="shortcut-item">
                    <span>Speed Up</span>
                    <span class="shortcut-key">↑</span>
                </div>
                <div class="shortcut-item">
                    <span>Speed Down</span>
                    <span class="shortcut-key">↓</span>
                </div>
                <div class="shortcut-item">
                    <span>Text Larger</span>
                    <span class="shortcut-key">+</span>
                </div>
                <div class="shortcut-item">
                    <span>Text Smaller</span>
                    <span class="shortcut-key">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State management
        const state = {
            script: '',
            scrollSpeed: 2,
            textSize: 'medium',
            isPlaying: false,
            scrollPosition: 0,
            animationId: null,
            lastTimestamp: null
        };

        // DOM elements
        const elements = {
            scriptInput: document.getElementById('scriptInput'),
            speedSlider: document.getElementById('speedSlider'),
            speedValue: document.getElementById('speedValue'),
            sizeButtons: document.querySelectorAll('.size-btn'),
            startBtn: document.getElementById('startBtn'),
            editMode: document.getElementById('editMode'),
            teleprompterMode: document.getElementById('teleprompterMode'),
            countdown: document.getElementById('countdown'),
            countdownNumber: document.getElementById('countdownNumber'),
            scriptContainer: document.getElementById('scriptContainer'),
            scriptDisplay: document.getElementById('scriptDisplay'),
            pauseBtn: document.getElementById('pauseBtn'),
            exitBtn: document.getElementById('exitBtn'),
            speedIndicator: document.getElementById('speedIndicator'),
            currentSpeed: document.getElementById('currentSpeed')
        };

        // Load state from localStorage
        function loadState() {
            const saved = localStorage.getItem('teleprompterState');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.script = parsed.script || '';
                state.scrollSpeed = parsed.scrollSpeed || 2;
                state.textSize = parsed.textSize || 'medium';

                elements.scriptInput.value = state.script;
                elements.speedSlider.value = state.scrollSpeed;
                elements.speedValue.textContent = state.scrollSpeed.toFixed(1) + 'x';

                elements.sizeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.size === state.textSize);
                });
            }
        }

        // Save state to localStorage
        function saveState() {
            localStorage.setItem('teleprompterState', JSON.stringify({
                script: state.script,
                scrollSpeed: state.scrollSpeed,
                textSize: state.textSize
            }));
        }

        // Script input handler
        elements.scriptInput.addEventListener('input', (e) => {
            state.script = e.target.value;
            saveState();
        });

        // Speed slider handler
        elements.speedSlider.addEventListener('input', (e) => {
            state.scrollSpeed = parseFloat(e.target.value);
            elements.speedValue.textContent = state.scrollSpeed.toFixed(1) + 'x';
            elements.currentSpeed.textContent = state.scrollSpeed.toFixed(1) + 'x';
            saveState();
        });

        // Text size handlers
        elements.sizeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                elements.sizeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.textSize = btn.dataset.size;

                elements.scriptDisplay.className = `script-display text-${state.textSize}`;
                saveState();
            });
        });

        // Countdown function
        function showCountdown() {
            return new Promise((resolve) => {
                elements.countdown.style.display = 'flex';
                let count = 3;

                function updateCountdown() {
                    if (count > 0) {
                        elements.countdownNumber.textContent = count;
                        elements.countdownNumber.style.animation = 'none';
                        setTimeout(() => {
                            elements.countdownNumber.style.animation = 'countdownPulse 1s ease-in-out';
                        }, 10);
                        count--;
                        setTimeout(updateCountdown, 1000);
                    } else {
                        elements.countdown.style.display = 'none';
                        resolve();
                    }
                }

                updateCountdown();
            });
        }

        // Start teleprompter
        elements.startBtn.addEventListener('click', async () => {
            if (!state.script.trim()) {
                alert('Please enter your script first!');
                return;
            }

            // Prepare teleprompter
            elements.scriptDisplay.textContent = state.script;
            elements.scriptDisplay.className = `script-display text-${state.textSize}`;
            elements.currentSpeed.textContent = state.scrollSpeed.toFixed(1) + 'x';

            // Show teleprompter mode
            elements.editMode.style.display = 'none';
            elements.teleprompterMode.classList.add('active');

            // Reset scroll position
            state.scrollPosition = 0;
            elements.scriptContainer.scrollTop = 0;

            // Show countdown
            await showCountdown();

            // Start scrolling
            state.isPlaying = true;
            state.lastTimestamp = performance.now();
            startScrolling();
            updatePauseButton();
        });

        // Scrolling animation
        function startScrolling() {
            function scroll(timestamp) {
                if (!state.isPlaying) return;

                if (state.lastTimestamp === null) {
                    state.lastTimestamp = timestamp;
                }

                const deltaTime = timestamp - state.lastTimestamp;
                state.lastTimestamp = timestamp;

                // Scroll speed in pixels per second (base speed * multiplier)
                const pixelsPerSecond = 50 * state.scrollSpeed;
                const scrollAmount = (pixelsPerSecond * deltaTime) / 1000;

                state.scrollPosition += scrollAmount;
                elements.scriptContainer.scrollTop = state.scrollPosition;

                // Check if we've reached the end
                const maxScroll = elements.scriptContainer.scrollHeight - elements.scriptContainer.clientHeight;
                if (state.scrollPosition >= maxScroll) {
                    state.isPlaying = false;
                    updatePauseButton();
                    return;
                }

                state.animationId = requestAnimationFrame(scroll);
            }

            state.animationId = requestAnimationFrame(scroll);
        }

        // Toggle pause
        function togglePause() {
            state.isPlaying = !state.isPlaying;
            if (state.isPlaying) {
                state.lastTimestamp = performance.now();
                startScrolling();
            } else {
                if (state.animationId) {
                    cancelAnimationFrame(state.animationId);
                }
            }
            updatePauseButton();
        }

        function updatePauseButton() {
            elements.pauseBtn.textContent = state.isPlaying ? 'Pause (Space)' : 'Resume (Space)';
            elements.pauseBtn.classList.toggle('playing', state.isPlaying);
        }

        elements.pauseBtn.addEventListener('click', togglePause);

        // Exit teleprompter
        function exitTeleprompter() {
            state.isPlaying = false;
            if (state.animationId) {
                cancelAnimationFrame(state.animationId);
            }
            elements.teleprompterMode.classList.remove('active');
            setTimeout(() => {
                elements.editMode.style.display = 'block';
            }, 300);
        }

        elements.exitBtn.addEventListener('click', exitTeleprompter);

        // Manual scroll override
        elements.scriptContainer.addEventListener('wheel', (e) => {
            state.scrollPosition = elements.scriptContainer.scrollTop;
        }, { passive: true });

        elements.scriptContainer.addEventListener('touchmove', (e) => {
            state.scrollPosition = elements.scriptContainer.scrollTop;
        }, { passive: true });

        // Adjust speed with indicators
        let speedIndicatorTimeout;
        function adjustSpeed(delta) {
            state.scrollSpeed = Math.max(0.5, Math.min(5, state.scrollSpeed + delta));
            elements.speedSlider.value = state.scrollSpeed;
            elements.speedValue.textContent = state.scrollSpeed.toFixed(1) + 'x';
            elements.currentSpeed.textContent = state.scrollSpeed.toFixed(1) + 'x';
            saveState();

            // Show speed indicator
            elements.speedIndicator.classList.add('visible');
            clearTimeout(speedIndicatorTimeout);
            speedIndicatorTimeout = setTimeout(() => {
                elements.speedIndicator.classList.remove('visible');
            }, 2000);
        }

        // Adjust text size
        const sizes = ['small', 'medium', 'large', 'xlarge'];
        function adjustTextSize(direction) {
            const currentIndex = sizes.indexOf(state.textSize);
            let newIndex = currentIndex + direction;
            newIndex = Math.max(0, Math.min(sizes.length - 1, newIndex));

            if (newIndex !== currentIndex) {
                state.textSize = sizes[newIndex];
                elements.scriptDisplay.className = `script-display text-${state.textSize}`;

                elements.sizeButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.size === state.textSize);
                });

                saveState();
            }
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            // Only handle shortcuts in teleprompter mode
            if (!elements.teleprompterMode.classList.contains('active')) return;

            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    togglePause();
                    break;
                case 'Escape':
                    e.preventDefault();
                    exitTeleprompter();
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    adjustSpeed(0.5);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    adjustSpeed(-0.5);
                    break;
                case '+':
                case '=':
                    e.preventDefault();
                    adjustTextSize(1);
                    break;
                case '-':
                case '_':
                    e.preventDefault();
                    adjustTextSize(-1);
                    break;
            }
        });

        // Initialize
        loadState();
    </script>
</body>
</html>
